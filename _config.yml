url: "https://beanzen.ru"
baseurl: ""
page_title: Beanzen — Your brewing journal
app_name: Beanzen
app_icon: assets/appicon.png
app_description: Connect your Bluetooth scale and keep a brewing journal.
# Add only verified public store URLs. Empty values hide store badges.
ios_app_id: ""
ios_app_country: us
appstore_link: ""
playstore_link: ""
android_download_link: "https://github.com/securny/beanzen/releases"
enable_smart_app_banner: false
app_screenshot: assets/screenshot/beanzen-real-main-replay-ios-en.png
your_name: Dmitry Berezkin
email_address: hello@beanzen.ru
policy_date: "2026-11-06"
lang: en
timezone: Europe/Moscow
sass:
  style: compressed
collections:
  pages:
    output: true
    permalink: /:path/
defaults:
  - scope:
      path: ""
    values:
      lang: en
markdown: kramdown
kramdown:
  input: Kramdown
strict_front_matter: true
liquid:
  error_mode: strict
exclude:
  - LICENSE
  - README.md
  - PRODUCT.md
  - DESIGN.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - docs
  - scripts
  - .bundle
  - .github
  - .impeccable
  - .ruby-version
  - node_modules
